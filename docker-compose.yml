version: "3.8"
services:
  pronotex:
    image: pronotex:local
    platform: linux/amd64
    restart: unless-stopped
    init: true
    env_file:
      - env
    environment:
      PHX_SERVER: "true"
      PORT: "4123"
      TZ: Europe/Paris
    ports:
      - "127.0.0.1:4123:4123"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
